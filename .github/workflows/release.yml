name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

# Runs for different tags must not interleave, or an older tag's release job
# can finish last and steal the moving tags.
concurrency:
  group: release

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # One runner per platform; each pushes an untagged image by digest.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@v7

      - name: Check VERSION matches tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(tr -d '[:space:]' < VERSION)"
          [ "$have" = "$want" ] || { echo "VERSION is $have but tag is $GITHUB_REF_NAME"; exit 1; }

      # No QEMU: the Dockerfile cross-compiles on the build platform and the
      # scratch stage only copies a file, so nothing is ever emulated.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-platform digests into one tagged multi-arch manifest.
  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the highest version tag may move "latest" and "major.minor";
      # re-running an older tag must not roll them back.
      - id: highest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          top=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "top tag is $top, this tag is $GITHUB_REF_NAME"
          echo "is=$([ "$top" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.highest.outputs.is }}
            type=raw,value=latest,enable=${{ steps.highest.outputs.is }}

      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reruns on the same tag must not fail on an existing release.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            --notes "Image: \`${IMAGE}:${GITHUB_REF_NAME#v}\`"
