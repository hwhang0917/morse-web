services:
  morse-web:
    image: ghcr.io/hwhang0917/morse-web:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      # Keep the GC ahead of the box; ~37 KB per socket measured.
      GOMEMLIMIT: 1200MiB
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
