<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"morse-web","url":"{{ORIGIN}}/","image":"{{ORIGIN}}/img/og.png","description":"Free online Morse code key. Get paired with a stranger and tap dots and dashes at each other in real time.","applicationCategory":"CommunicationApplication","operatingSystem":"Any","browserRequirements":"Requires WebSocket and Web Audio","isAccessibleForFree":true,"offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"codeRepository":"https://github.com/hwhang0917/morse-web"}

<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="online" aria-live="polite"></div>
<details id="menu">
  <summary aria-label="Settings"></summary>
  <div>
    <label>Sound <input type="checkbox" data-setting="sound"></label>
    <label id="vib" hidden>Vibrate on incoming <input type="checkbox" data-setting="vibrate"></label>
    <label>Flash screen on incoming <input type="checkbox" data-setting="flash"></label>
    <label title="Wait for a human instead of pairing with a bot">Prefer human <input type="checkbox" data-setting="human"></label>
    <button id="newnick" type="button">New nickname</button>
    <a id="mcplink" href="/mcp.html" target="_blank" rel="noopener">MCP: use from an AI client</a>
    <details id="ref">
      <summary>Morse code reference</summary>
      <div>
        <span>A</span><code>.-</code><span>B</span><code>-...</code><span>C</span><code>-.-.</code><span>D</span><code>-..</code><span>E</span><code>.</code>
        <span>F</span><code>..-.</code><span>G</span><code>--.</code><span>H</span><code>....</code><span>I</span><code>..</code><span>J</span><code>.---</code>
        <span>K</span><code>-.-</code><span>L</span><code>.-..</code><span>M</span><code>--</code><span>N</span><code>-.</code><span>O</span><code>---</code>
        <span>P</span><code>.--.</code><span>Q</span><code>--.-</code><span>R</span><code>.-.</code><span>S</span><code>...</code><span>T</span><code>-</code>
        <span>U</span><code>..-</code><span>V</span><code>...-</code><span>W</span><code>.--</code><span>X</span><code>-..-</code><span>Y</span><code>-.--</code>
        <span>Z</span><code>--..</code><span>0</span><code>-----</code><span>1</span><code>.----</code><span>2</span><code>..---</code><span>3</span><code>...--</code>
        <span>4</span><code>....-</code><span>5</span><code>.....</code><span>6</span><code>-....</code><span>7</span><code>--...</code><span>8</span><code>---..</code>
        <span>9</span><code>----.</code>
      </div>
    </details>
    <footer>v{{VERSION}} · <a href="https://github.com/hwhang0917/morse-web">GitHub</a></footer>
  </div>
</details>
<div id="toast" role="status" aria-live="polite"></div>
<div id="nick"><span class="dot"></span><span class="name"></span> <span class="tag"></span></div>
<div id="status">connecting…</div>
<button id="key" aria-label="Morse key">KEY</button>
<script type="module" src="/js/app.js"></script>
</body>
</html>
