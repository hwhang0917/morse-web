<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morse</title>
<meta name="description" content="1-on-1 Morse code over WebSocket. Get paired with a stranger and key at each other in real time.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="canonical" href="{{ORIGIN}}/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="morse-web">
<meta property="og:title" content="Morse: 1-on-1 Morse code">
<meta property="og:description" content="Get paired with a stranger and key Morse at each other in real time.">
<meta property="og:url" content="{{ORIGIN}}/">
<meta property="og:image" content="{{ORIGIN}}/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
:root { color-scheme: dark; --accent: #e8b23a; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem;
  background: #111; color: #ddd; font-family: system-ui, sans-serif; transition: background .05s;
}
#nick { font-size: 1.2rem; }
#nick .name { color: var(--accent); font-weight: 600; }
#nick .tag { opacity: .5; font-size: .9em; }
#status { min-height: 1.4em; }
footer { position: fixed; bottom: .8rem; font-size: .8rem; opacity: .5; }
footer a { color: inherit; }
#key {
  width: min(60vw, 60vh); aspect-ratio: 1; border-radius: 50%; border: none;
  background: #333; color: #ccc; font-size: 1.5rem; letter-spacing: .2em; cursor: pointer;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  transition: background .05s;
}
body.tx #key { background: var(--accent); color: #111; }
body.rx { background: #23305a; }

#toast {
  position: fixed; top: 1.2rem; left: 50%; transform: translateX(-50%);
  padding: .6rem 1.2rem; border-radius: .4rem; font-weight: 600; color: #fff;
  opacity: 0; transition: opacity .25s; pointer-events: none; max-width: calc(100vw - 6rem);
}
#toast.show { opacity: 1; }
#toast.ok { background: #2e7d32; }
#toast.bad { background: #c62828; }

/* Native collapsible: no JS needed for open/close. */
#menu { position: fixed; top: 1rem; right: 1rem; z-index: 10; }
#menu summary {
  list-style: none; cursor: pointer; font-size: 1.6rem; line-height: 1; padding: .3rem .5rem;
  user-select: none; -webkit-tap-highlight-color: transparent; position: relative; z-index: 1;
}
#menu summary::-webkit-details-marker { display: none; }
#menu summary::before { content: "☰"; }
#menu[open] summary::before { content: "✕"; }
#menu > div {
  position: absolute; right: 0; margin-top: .3rem; min-width: 16rem; padding: .9rem 1rem;
  background: #2a2a2a; border: 1px solid #555; border-radius: .5rem; display: grid; gap: .8rem;
  box-shadow: 0 .5rem 1.5rem rgba(0, 0, 0, .6);
}
#menu label { display: flex; align-items: center; gap: .6rem; cursor: pointer; white-space: nowrap; }
#menu label[hidden] { display: none; }
/* Checkbox drawn as a switch; the ON/OFF word comes from the label itself. */
#menu input[type="checkbox"] {
  appearance: none; margin: 0 0 0 auto; width: 2.6rem; height: 1.4rem; border-radius: .7rem;
  background: #555; position: relative; cursor: pointer; transition: background .15s;
}
#menu input[type="checkbox"]::before {
  content: ""; position: absolute; top: .15rem; left: .15rem; width: 1.1rem; height: 1.1rem;
  border-radius: 50%; background: #eee; transition: left .15s;
}
#menu input[type="checkbox"]:checked { background: var(--accent); }
#menu input[type="checkbox"]:checked::before { left: 1.35rem; }
#menu label::after { content: "OFF"; width: 2rem; font-size: .75rem; font-weight: 600; opacity: .5; }
#menu label:has(:checked)::after { content: "ON"; color: var(--accent); opacity: 1; }

/* Phones: the panel becomes a right-hand drawer with a dimmed backdrop. */
@media (max-width: 600px) {
  #menu[open]::before { content: ""; position: fixed; inset: 0; background: rgba(0, 0, 0, .55); }
  #menu > div {
    position: fixed; top: 0; right: 0; bottom: 0; margin: 0; width: min(80vw, 20rem);
    border: none; border-left: 1px solid #555; border-radius: 0;
    padding: 4.5rem 1.2rem 1.2rem; align-content: start; font-size: 1.05rem;
    animation: slide-in .2s ease-out;
  }
  @keyframes slide-in { from { transform: translateX(100%); } }
}
#menu button { padding: .5rem; background: #333; color: #ddd; border: 1px solid #555; border-radius: .3rem; cursor: pointer; }
</style>
</head>
<body>
<details id="menu">
  <summary aria-label="Settings"></summary>
  <div>
    <label>Sound <input type="checkbox" data-setting="sound"></label>
    <label id="vib" hidden>Vibrate on incoming <input type="checkbox" data-setting="vibrate"></label>
    <label>Flash screen on incoming <input type="checkbox" data-setting="flash"></label>
    <button id="newnick" type="button">New nickname</button>
  </div>
</details>
<div id="toast" role="status" aria-live="polite"></div>
<div id="nick"><span class="name"></span> <span class="tag"></span></div>
<div id="status">connecting…</div>
<button id="key" aria-label="Morse key">KEY</button>
<footer>v{{VERSION}} · <a href="https://github.com/hwhang0917/morse-web">GitHub</a></footer>
<script>
'use strict';
const RECONNECT_MS = 2000, TONE_LOCAL_HZ = 600, TONE_REMOTE_HZ = 700, RAMP_S = 0.005;
// The Vibration API only takes durations, and a cancel issued right after a
// start can be lost (the buzz is started asynchronously by the OS), so "hold"
// is a train of short pulses: a lost cancel overshoots by one pulse, not seconds.
const VIBRATE_PULSE_MS = 100, VIBRATE_REISSUE_MS = 80;
const NICK_COOKIE_MAX_AGE_S = 365 * 24 * 3600;
const TOAST_MS = 3000;
const OP = { KEY_UP: 0x00, KEY_DOWN: 0x01, WAITING: 0x10, PAIRED: 0x11 };
// Mirrors nickRE on the server; a stale cookie that fails it would 400 forever.
const NICK_RE = /^[a-z]{1,20}_[a-z]{1,20}_[a-z0-9]{4}$/;
// Flash is off by default: a full-screen strobe is a seizure risk.
const DEFAULT_SETTINGS = { sound: true, vibrate: false, flash: false };

const $name = document.querySelector('#nick .name');
const $tag = document.querySelector('#nick .tag');
const $status = document.getElementById('status');
const $key = document.getElementById('key');
const $toast = document.getElementById('toast');
const $menu = document.getElementById('menu');

// Tapping anywhere outside the panel closes it. The drawer backdrop is a
// pseudo-element of #menu itself, so test against the panel and summary only.
document.addEventListener('pointerdown', e => {
  if ($menu.open && !e.target.closest('#menu > div, #menu summary')) $menu.open = false;
});

let toastTimer;
function toast(text, kind) {
  $toast.textContent = text;
  $toast.className = `show ${kind}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove('show'), TOAST_MS);
}

// ---- settings (localStorage) ----
function loadSettings() {
  try { return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem('settings')) }; }
  catch { return { ...DEFAULT_SETTINGS }; }
}
const settings = loadSettings();
function saveSettings() {
  try { localStorage.setItem('settings', JSON.stringify(settings)); } catch {}
}
if (navigator.vibrate) document.getElementById('vib').hidden = false;
for (const box of document.querySelectorAll('[data-setting]')) {
  const key = box.dataset.setting;
  box.checked = settings[key];
  box.addEventListener('change', () => {
    settings[key] = box.checked;
    saveSettings();
    // Turning something off mid-signal must also stop the signal.
    if (!box.checked) { if (key === 'sound') { localTone(false); remoteTone(false); } if (key === 'vibrate') vibrate(false); if (key === 'flash') document.body.classList.remove('rx'); }
    render();
  });
}

// ---- audio: always-running oscillators gated by gain, so on/off is click-free.
// The remote pitch differs so you can tell who is keying. ----
const ac = new AudioContext();
function tone(hz) {
  const osc = new OscillatorNode(ac, { frequency: hz });
  const gain = new GainNode(ac, { gain: 0 });
  osc.connect(gain).connect(ac.destination);
  osc.start();
  return on => gain.gain.setTargetAtTime(on && settings.sound ? 1 : 0, ac.currentTime, RAMP_S);
}
const localTone = tone(TONE_LOCAL_HZ), remoteTone = tone(TONE_REMOTE_HZ);

let vibTimer = null;
function vibrate(on) {
  clearInterval(vibTimer);
  vibTimer = null;
  if (!on) { navigator.vibrate(0); return; }
  navigator.vibrate(VIBRATE_PULSE_MS);
  vibTimer = setInterval(() => navigator.vibrate(VIBRATE_PULSE_MS), VIBRATE_REISSUE_MS);
}

// ---- state ----
let ws, retryTimer, nick = '', partner = '', state = 'connecting…', down = false;

function render() {
  const needAudio = settings.sound && ac.state !== 'running';
  $status.textContent = state + (needAudio ? ' · tap the key to enable audio' : '');
}
ac.onstatechange = render;

function showNick() {
  // sleepy_beaver_jf34 -> "sleepy_beaver" highlighted, "(jf34)" dimmed.
  const i = nick.lastIndexOf('_');
  $name.textContent = nick.slice(0, i);
  $tag.textContent = '(' + nick.slice(i + 1) + ')';
}

function rx(on) {
  remoteTone(on);
  if (settings.vibrate) vibrate(on);
  if (settings.flash) document.body.classList.toggle('rx', on);
}

// Only transitions are sent, which guards multi-touch and the keyboard path.
function setKey(isDown) {
  if (isDown === down) return;
  down = isDown;
  document.body.classList.toggle('tx', down);
  localTone(down);
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(new Uint8Array([down ? OP.KEY_DOWN : OP.KEY_UP]));
}

$key.addEventListener('pointerdown', e => { $key.setPointerCapture(e.pointerId); ac.resume(); setKey(true); });
$key.addEventListener('pointerup', () => setKey(false));
$key.addEventListener('pointercancel', () => setKey(false));
$key.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat || e.target.closest('#menu')) return;
  e.preventDefault();
  ac.resume();
  setKey(true);
});
window.addEventListener('keyup', e => { if (e.code === 'Space') setKey(false); });
// A held key while alt-tabbing would otherwise leave the partner's tone on.
window.addEventListener('blur', () => setKey(false));
document.addEventListener('visibilitychange', () => { if (document.hidden) setKey(false); });

// ---- nickname (cookie, so it survives closing the tab) ----
function cookieNick() {
  const m = document.cookie.match(/(?:^|; )nick=([^;]*)/);
  return m && NICK_RE.test(m[1]) ? m[1] : '';
}
async function registerNick() {
  const r = await fetch('/api/register', { method: 'POST' });
  const n = (await r.json()).nick;
  document.cookie = `nick=${n}; Max-Age=${NICK_COOKIE_MAX_AGE_S}; Path=/; SameSite=Lax`;
  return n;
}

// ---- socket ----
function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const sock = new WebSocket(`${scheme}://${location.host}/ws?nick=${nick}`);
  sock.binaryType = 'arraybuffer';
  sock.onmessage = e => {
    const b = new Uint8Array(e.data);
    switch (b[0]) {
      case OP.KEY_DOWN: rx(true); return;
      case OP.KEY_UP: rx(false); return;
      case OP.WAITING:
        rx(false);
        // The same frame also means "partner left"; only toast when there was one.
        if (partner) toast(`${partner} disconnected`, 'bad');
        partner = '';
        state = 'waiting for a partner…';
        break;
      case OP.PAIRED:
        partner = new TextDecoder().decode(b.subarray(1));
        toast(`connected to ${partner}`, 'ok');
        state = 'connected to ' + partner;
        break;
    }
    render();
  };
  sock.onclose = () => {
    rx(false);
    setKey(false);
    partner = '';
    state = 'disconnected, retrying…';
    render();
    retryTimer = setTimeout(connect, RECONNECT_MS);
  };
  ws = sock;
}

document.getElementById('newnick').addEventListener('click', async () => {
  nick = await registerNick();
  showNick();
  // Drop the old socket without triggering its retry; connect fresh with the new nick.
  clearTimeout(retryTimer);
  ws.onclose = null;
  ws.close();
  rx(false);
  partner = '';
  state = 'connecting…';
  render();
  connect();
});

(async () => {
  nick = cookieNick() || await registerNick();
  showNick();
  render();
  connect();
})();
</script>
</body>
</html>
